<!DOCTYPE html>
<meta charset="utf-8">
<title>Course Schedules</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:16px 14px 40px;background:#fff;color:#1c1c1c;
     font:17px/1.55 "Segoe UI",Calibri,-apple-system,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto}
h2{margin:26px 0 10px;padding:0 0 7px;font-size:15px;font-weight:700;
   letter-spacing:.9px;text-transform:uppercase;color:#1F4E79;
   border-bottom:2px solid #1F4E79}
h2:first-of-type{margin-top:4px}
h2 span{display:block;margin-top:3px;font-size:14px;font-weight:400;
        letter-spacing:0;text-transform:none;color:#4a5764}
.list{display:grid;grid-template-columns:1fr;gap:9px}
a.sec{display:block;padding:13px 15px;border:1px solid #dbe5ee;border-left:4px solid #1F4E79;
      border-radius:7px;background:#fff;text-decoration:none;color:inherit}
a.sec:active{background:#EDF3F8}
.num{font-size:19px;font-weight:700;color:#1F4E79}
.ttl{font-size:19px;font-weight:600;color:#1F4E79}
.meta{margin-top:5px;font-size:15px;color:#5a6773}
footer{margin:30px 0 0;padding-top:12px;border-top:1px solid #e3e9ef;
       font-size:14px;line-height:1.6;color:#5a6773}
footer a{color:#1F4E79}
@media(min-width:620px){
  body{padding:22px 20px 48px}
  .list{grid-template-columns:1fr 1fr;gap:10px}
  a.sec:hover{background:#F7FAFC;border-color:#b9d2e7}
}
@media print{
  body{padding:0;font-size:11pt;color:#000}
  .list{grid-template-columns:1fr 1fr}
  a.sec{border-color:#bbb;break-inside:avoid}
  h2{break-after:avoid}
}
</style>
<div class="wrap">
  <h2>Course Schedules<span>Pick a course to view its reading and problem schedule</span></h2>

    <a class="sec" href="engr213_index.html">
      <span class="ttl">ENGR 213</span>
      <div class="meta">Differential Equations</div>
    </a>
    <a class="sec" href="engr233_index.html">
      <span class="ttl">ENGR 233</span>
      <div class="meta">Advanced Calculus</div>
    </a>
    <a class="sec" href="engr311_index.html">
      <span class="ttl">ENGR 311</span>
      <div class="meta">Transform Calculus</div>
    </a>
  </div>
</div>
